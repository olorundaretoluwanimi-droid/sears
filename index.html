</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// "What Happened to Sears?" — the series' warm dark investigation look (dark warm-brown ground, sepia archive, hard-edged pictures with
// mono source tags, IBM Plex type, paper cards for quotes and order blanks, red only for dates and numbers, 47 px captions) with this
// episode's motion graphics: order blanks that fill themselves, page curls between chapters, a moving camera, type that drops in, red
// stamps, a schematic rail map with parcels, a house assembled from numbered lumber, counts as dots. render(t) is deterministic.
const W = 1920, H = 1080, cv = document.getElementById('c'), x = cv.getContext('2d');
const C = { bg:'#15110D', desk:'#15110D', panel:'#221C16', line:'#3B3229', paper:'#EADFC6', paper2:'#d9cdb0', mount:'#221C16', ink:'#2A2118', ink2:'#5a4b3a',

let FILM = { scenes: [], subs: [], dur: 10 }, MAP = null, SIZES = {}, SPECK, GRAIN = [];
const IM = {};
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), seg = (t, a, b) => clamp((t - a) / (b - a)), lerp = (a, b, k) => a + (b - a) * k;

function load(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => { console.warn('missing', src); r(null); }; i.src = src; }); }
const AT = (s, v) => v == null ? s.t0 + .4 : v < 0 ? s.t0 + (-v) * (s.vd || (s.t1 - s.t0)) : s.t0 + v;   // seconds after t0, or (negative) a fraction of the line
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function makeSpeck() { const c = mk(512, 512), g = c.getContext('2d'), R = rnd(23); for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(0,0,0,${R() * .9})`; g.beginPath(); g.arc(R() * 512, R() * 512, R() * 2.2, 0, 7); g.fill(); } return c; }
function makeGrain() { for (let k = 0; k < 6; k++) { const c = mk(256, 256), g = c.getContext('2d'), d = g.createImageData(256, 256), R = rnd(100 + k);
  for (let i = 0; i < d.data.length; i += 4) { const n = 128 + (R() + R() + R() + R() - 2) * 70; d.data[i] = d.data[i + 1] = d.data[i + 2] = n; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); GRAIN.push(g.createPattern(c, 'repeat')); } }

// ── type: IBM Plex Sans / Mono; quotes and asides in Source Serif italic ───────────────────────────────────
const F = { fell: 'Sans', sc: 'Sans', ost: 'Mono', serif: 'Sans', sans: 'Sans', mono: 'Mono', hand: 'Mono' };
function fontOf(o, size) {
  const fam = ({ Sans: 'Sans', Mono: 'Mono' })[o.f] || F[String(o.f || '').toLowerCase()] || 'Sans', s = size || o.s || 30;
  if (o.it) return `italic 400 ${s}px SerifI`;
  let w = o.w || 400; w = fam === 'Mono' ? (w >= 500 ? 600 : 400) : (w >= 650 ? 700 : w >= 450 ? 500 : 400);

}
function txt(s, X, Y, o = {}) {

  x.textAlign = o.al || 'left'; x.textBaseline = o.bl || 'alphabetic'; if (o.ls) x.letterSpacing = o.ls + 'px';
  if (o.sh) { x.shadowColor = o.sh; x.shadowBlur = o.sb ?? 10; }
  x.fillText(s, X, Y); const m = x.measureText(s).width; x.restore();
  if (o.id && REC) { const x0 = o.al === 'center' ? X - m / 2 : o.al === 'right' ? X - m : X; REC.push({ id: o.id, text: s, x0, y0: Y - (o.s || 30), x1: x0 + m, y1: Y, pass: o.pass }); }
  return m;
}
function measure(s, o) { x.save(); x.font = fontOf(o); if (o.ls) x.letterSpacing = o.ls + 'px'; const m = x.measureText(s).width; x.restore(); return m; }
function rr(X, Y, w, h, r) { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }
function hair(a, b, c, d, col = C.line, lw = 1.5) { x.strokeStyle = col; x.lineWidth = lw; x.beginPath(); x.moveTo(a, b); x.lineTo(c, d); x.stroke(); }
function shade(X, Y, w, h, a = .85) { x.save(); x.globalAlpha *= a; x.fillStyle = C.bg; x.fillRect(X, Y, w, h); x.restore(); }
function grain(X, Y, w, h, a = .16, t = 0) { x.save(); x.globalCompositeOperation = 'overlay'; x.globalAlpha = a; x.fillStyle = GRAIN[Math.floor(t * 30) % 6]; x.fillRect(X, Y, w, h); x.restore(); }

// ── pictures: the series grade (sepia archive, papery documents warmed, colour photos muted), hard edges, white flash on cut-in ──
const COVERS = new Set(['c1902_n0', 'c1928_n0', 'mh1911_n0', 'mh1918_n0', 'mh1918_cover', 'c1912_n0']);
const GR = { sepia: 'grayscale(1) sepia(.6) contrast(1.1) brightness(.97)', colour: 'sepia(.3) saturate(.8) contrast(1.05)',
             paper: 'grayscale(1) sepia(.85) contrast(1.15) brightness(.86)', none: 'none' };
function cover(img, X, Y, w, h, o = {}) {
  if (!img) { x.fillStyle = '#000'; x.fillRect(X, Y, w, h); return; }
  let g = o.grade || 'sepia'; if (COVERS.has(img._n)) g = 'colour';
  const z = o.z || 1, s = Math.max(w / img.width, h / img.height) * z, sw = w / s, sh = h / s;
  const sx = clamp((img.width - sw) * (o.fx ?? .5), 0, img.width - sw), sy = clamp((img.height - sh) * (o.fy ?? .5), 0, img.height - sh);
  x.save(); x.fillStyle = '#000'; x.fillRect(X, Y, w, h); x.filter = GR[g]; x.drawImage(img, sx, sy, sw, sh, X, Y, w, h); x.filter = 'none';
  if (g === 'paper') { x.globalCompositeOperation = 'multiply'; x.globalAlpha *= .6; x.fillStyle = '#C9A06A'; x.fillRect(X, Y, w, h); }
  x.restore(); if (g !== 'none') grain(X, Y, w, h, g === 'colour' ? .12 : .2, o.t || 0);
}
function plate(img, X, Y, w, h, o = {}) {
  x.save(); x.globalAlpha *= o.a ?? 1; cover(img, X, Y, w, h, o);
  if (o.flash > 0) { x.save(); x.globalAlpha *= o.flash * .9; x.fillStyle = '#fff'; x.fillRect(X, Y, w, h); x.restore(); }
  x.strokeStyle = C.line; x.lineWidth = 1; x.strokeRect(X + .5, Y + .5, w - 1, h - 1);
  if (o.cap) capPill(o.cap, X + 18, Y + h - 18, o.capA ?? 1);
  x.restore();
}
function capPill(s, X, Y, a = 1) {   // a small mono label in the picture's lower-left corner
  const lines = String(s).split('\n').map(l => l.toUpperCase()), fs = 19, wd = Math.max(...lines.map(l => measure(l, { s: fs, f: 'Mono', w: 600, ls: 1 }))) + 36, ht = lines.length * 27 + 18;
  x.save(); x.globalAlpha *= a; shade(X, Y - ht, wd, ht, .82); x.fillStyle = C.red; x.fillRect(X, Y - ht, 4, ht);
  lines.forEach((l, i) => txt(l, X + 20, Y - ht + 30 + i * 27, { s: fs, f: 'Mono', w: 600, ls: 1, c: C.cream })); x.restore();
}
const TINT = new Map();
function tinted(img, col) { const k = img._n + col; if (TINT.has(k)) return TINT.get(k); const c = mk(img.width, img.height), g = c.getContext('2d');
  g.drawImage(img, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height); TINT.set(k, c); return c; }
function cut(img, X, Y, w, o = {}) {   // catalog line-art (engravings, type, floor plans) drawn as cream lines on the dark ground
  if (!img) return; const h = w * img.height / img.width; x.save(); x.translate(X, Y); x.rotate((o.rot || 0) * Math.PI / 180); x.globalAlpha *= o.a ?? 1;
  x.drawImage(o.ink ? img : tinted(img, o.col || '#E6D7B8'), -w / 2, -h / 2, w, h); x.restore();
}
// type that drops in letter by letter (ease-back) — Plex Sans bold
function drop(s, X, Y, t, t0, o = {}) {
  o = Object.assign({ w: 700 }, o); const fs = o.s || 90, al = o.al || 'left', st = o.st ?? .03, wd = measure(s, o); let cx = al === 'center' ? X - wd / 2 : al === 'right' ? X - wd : X;
  x.save(); x.font = fontOf(o); if (o.ls) x.letterSpacing = o.ls + 'px'; x.fillStyle = o.c || C.cream; x.textBaseline = 'alphabetic';
  for (let i = 0; i < s.length; i++) {
    const ch = s[i], cw = x.measureText(ch).width + (o.ls || 0), k = seg(t, t0 + i * st, t0 + i * st + .26);
    if (k > 0) { const e = eback(k); x.save(); x.globalAlpha *= clamp(k * 3); x.translate(cx + cw / 2, Y - fs * .5 * (1 - e)); x.fillText(ch, -cw / 2 + (o.ls || 0) / 2, 0); x.restore(); }
    cx += cw;
  }
  x.restore(); const x0 = al === 'center' ? X - wd / 2 : al === 'right' ? X - wd : X;
  if (o.id && REC && seg(t, t0 + s.length * st, t0 + s.length * st + .3) >= 1) REC.push({ id: o.id, text: s, x0, y0: Y - fs, x1: x0 + wd, y1: Y });
  return wd;
}
// a red stamp for dates and prices: lands from 1.5× in 0.14 s, slight tilt, ink broken by a speckle mask (Plex Mono)
function stamp(s, X, Y, t, t0, o = {}) {

  const c = mk(Math.ceil(wd + 60), Math.ceil(fs * 1.5)), g = c.getContext('2d');
  g.font = `600 ${fs}px Mono`; g.fillStyle = o.c || C.red; g.textBaseline = 'middle'; g.fillText(s, 30, c.height / 2 + fs * .04);
  if (o.box !== false) { g.strokeStyle = o.c || C.red; g.lineWidth = Math.max(2, fs * .05); g.strokeRect(10, 6, c.width - 20, c.height - 12); }
  g.globalCompositeOperation = 'destination-out'; g.globalAlpha = .4; g.drawImage(SPECK, (o.seed || 0) * 37 % 200, 0, c.width, c.height, 0, 0, c.width, c.height);

  x.drawImage(c, -c.width / 2, -c.height / 2); x.restore();

}
// a typed entry: Plex Mono, revealed character by character with a block cursor
function hand(s, X, Y, t, t0, dur, o = {}) {
  const fs = o.s || 54, k = seg(t, t0, t0 + dur); if (k <= 0) return; const n = Math.round(s.length * k), part = s.slice(0, n);
  const w = txt(part, X, Y, { s: fs, f: 'Mono', w: o.w || 600, c: o.c || C.ink });

}
function counter(v, d = 0) { return v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function paperCard(X, Y, w, h, t = 0) { x.fillStyle = C.paper; x.fillRect(X, Y, w, h); x.save(); x.globalAlpha = .1; x.globalCompositeOperation = 'multiply'; x.fillStyle = GRAIN[Math.floor(t * 30) % 6]; x.fillRect(X, Y, w, h); x.restore();
  x.strokeStyle = '#c9bb9c'; x.lineWidth = 1; x.strokeRect(X + .5, Y + .5, w - 1, h - 1); }

// ── grounds and camera ────────────────────────────────────────────────────────────────────────────────────
// the series' flat warm-dark ground
function ground() { x.fillStyle = C.bg; x.fillRect(0, 0, W, H); }
// camera keys: [[time (s after t0), x, y, zoom, roll°], ...], eased between keys; returns a transform applied around the screen centre
function camAt(s, t) {
  const K = s.cam || [[0, W / 2, H / 2, 1, 0]], l = t - s.t0; let i = 0; while (i < K.length - 1 && K[i + 1][0] <= l) i++;
  const a = K[i], b = K[Math.min(i + 1, K.length - 1)], k = b === a ? 0 : eio(seg(l, a[0], b[0]));
  return { x: lerp(a[1], b[1], k), y: lerp(a[2], b[2], k), z: lerp(a[3], b[3], k), r: lerp(a[4] || 0, b[4] || 0, k) };
}
function withCam(c, fn) { x.save(); x.translate(W / 2, H / 2); x.rotate(c.r * Math.PI / 180); x.scale(c.z, c.z); x.translate(-c.x, -c.y); fn(); x.restore(); }

// ── the map (Natural Earth, schematic) ────────────────────────────────────────────────────────────────────
function mapDraw(X, Y, w, o = {}) {
  if (!MAP) return; const s = w / MAP.W, dark = o.dark !== false, P = (p) => [X + p[0] * s, Y + p[1] * s];
  x.save(); x.beginPath(); x.rect(X, Y, w, MAP.H * s); x.clip();
  x.fillStyle = dark ? '#2a231b' : 'rgba(205,184,140,.55)'; x.strokeStyle = dark ? '#7a6650' : C.ink2; x.lineWidth = 1.2;
  for (const r of MAP.land) { x.beginPath(); r.forEach((p, i) => { const [a, b] = P(p); i ? x.lineTo(a, b) : x.moveTo(a, b); }); x.closePath(); x.fill(); x.stroke(); }
  x.fillStyle = dark ? '#18130e' : 'rgba(236,226,200,.9)';
  for (const r of MAP.lakes) { x.beginPath(); r.forEach((p, i) => { const [a, b] = P(p); i ? x.lineTo(a, b) : x.moveTo(a, b); }); x.closePath(); x.fill(); x.stroke(); }
  if (o.rails !== false) { x.strokeStyle = dark ? 'rgba(170,140,105,.28)' : 'rgba(42,32,24,.34)'; x.lineWidth = .8;
    for (const r of MAP.rail) { x.beginPath(); r.forEach((p, i) => { const [a, b] = P(p); i ? x.lineTo(a, b) : x.moveTo(a, b); }); x.stroke(); } }
  x.restore(); return { s, P: (name) => P(MAP.towns[name]), H: MAP.H * s };
}
// a route from A to B as a gentle arc; k 0..1 drawn; a parcel rides the head
function route(A, B, k, o = {}) {
  if (k <= 0) return; const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2, dx = B[0] - A[0], dy = B[1] - A[1], bend = o.bend ?? .22;
  const cx = mx - dy * bend, cy = my + dx * bend, Q = u => [(1 - u) * (1 - u) * A[0] + 2 * (1 - u) * u * cx + u * u * B[0], (1 - u) * (1 - u) * A[1] + 2 * (1 - u) * u * cy + u * u * B[1]];
  x.save(); x.strokeStyle = o.c || C.red; x.lineWidth = o.lw || 3; x.setLineDash(o.dash || [10, 7]); x.beginPath();
  for (let u = 0; u <= k + 1e-6; u += .02) { const [a, b] = Q(Math.min(u, k)); u ? x.lineTo(a, b) : x.moveTo(a, b); } x.stroke(); x.setLineDash([]);

}
function parcel(X, Y, r) { x.save(); x.translate(X, Y); x.rotate(-.12); x.fillStyle = '#B48A55'; x.strokeStyle = C.ink; x.lineWidth = 1.5; x.fillRect(-r, -r * .7, 2 * r, 1.4 * r); x.strokeRect(-r, -r * .7, 2 * r, 1.4 * r);
  x.strokeStyle = '#6b3a1e'; x.beginPath(); x.moveTo(0, -r * .7); x.lineTo(0, r * .7); x.moveTo(-r, 0); x.lineTo(r, 0); x.stroke(); x.restore(); }
function town(p, name, o = {}) { x.save(); x.globalAlpha *= o.a ?? 1; x.fillStyle = o.c || C.red; x.beginPath(); x.arc(p[0], p[1], o.r || 8, 0, 7); x.fill();
  x.strokeStyle = C.cream; x.lineWidth = 1.5; x.stroke(); txt(name, p[0] + (o.dx ?? 16), p[1] + (o.dy ?? 9), { s: o.s || 30, w: 500, c: C.cream, al: o.al || 'left', id: o.id }); x.restore(); }

// ── captions ──────────────────────────────────────────────────────────────────────────────────────────────
function subs(t) {   // the series' captions: Plex Sans 500, 47 px, centred, black shadow, no band
  const s = FILM.subs.find(q => t >= q.t0 && t < q.t1); if (!s) return;
  x.save(); x.shadowColor = 'rgba(0,0,0,1)'; x.shadowBlur = 14; txt(s.text, W / 2, 1022, { s: 47, w: 500, al: 'center' }); txt(s.text, W / 2, 1022, { s: 47, w: 500, al: 'center' }); x.restore();
}
function srcTag(s, X, Y) { txt(s, X + 14, Y, { s: 17, f: 'Mono', w: 600, ls: 1, c: C.cream }); x.fillStyle = C.cream; x.fillRect(X, Y - 12, 6, 13); }

// ── page curl between two scenes (the chapter turn) ──────────────────────────────────────────────────────
function curl(p, drawTop, drawUnder) {
  drawUnder(); if (p >= 1) return; if (p <= 0) { drawTop(); return; }
  const d = [-.88, -.48], L = 2600, s = eio(p) * L, O = [W + 60, H + 60], n = [d[0], d[1]], P0 = [O[0] + n[0] * s, O[1] + n[1] * s];

  const rect = [[0, 0], [W, 0], [W, H], [0, H]];
  const clipPoly = (poly, keep) => { const out = []; for (let i = 0; i < poly.length; i++) { const A = poly[i], B = poly[(i + 1) % poly.length], sa = side(A) * keep, sb = side(B) * keep;
      if (sa >= 0) out.push(A); if (sa * sb < 0) { const u = sa / (sa - sb); out.push([A[0] + (B[0] - A[0]) * u, A[1] + (B[1] - A[1]) * u]); } } return out; };

  const path = poly => { x.beginPath(); poly.forEach((q, i) => i ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1])); x.closePath(); };
  if (top.length > 2) { x.save(); path(top); x.clip(); drawTop(); x.restore(); }
  if (lifted.length > 2) { const flap = lifted.map(refl);
    x.save(); x.shadowColor = 'rgba(20,12,4,.5)'; x.shadowBlur = 40; x.shadowOffsetX = -14; x.shadowOffsetY = -6; path(flap); x.fillStyle = '#2a231b'; x.fill(); x.restore();
    x.save(); path(flap); x.clip(); const g = x.createLinearGradient(P0[0], P0[1], P0[0] - n[0] * 260, P0[1] - n[1] * 260);
    g.addColorStop(0, 'rgba(0,0,0,.5)'); g.addColorStop(.35, 'rgba(241,231,211,.10)'); g.addColorStop(1, 'rgba(0,0,0,.15)'); x.fillStyle = g; x.fillRect(0, 0, W, H); x.restore(); }
}

// ── scenes ────────────────────────────────────────────────────────────────────────────────────────────────
// order blank: the chapter card. s: {no, art, year, price, img, imgCut, sub, dk}
// order blank: the chapter card — a paper card typed in Plex Mono, the price or date stamped in red; the chapter's picture beside it
function sBlank(t, s) {

    if (s.side) { const im = IM[s.side], h = 700, w = Math.min(560, im ? h * im.width / im.height : 520), X = 1800 - w;
      plate(im, X, 150, w, h, { grade: s.sideGrade, t }); }

    x.save(); x.translate(bx, by);
    x.strokeStyle = C.ink; x.lineWidth = 1; x.strokeRect(20.5, 20.5, w - 41, h - 41);
    txt('SEARS, ROEBUCK & CO.', w / 2, 96, { s: 50, w: 700, al: 'center', ls: 6, c: C.ink });
