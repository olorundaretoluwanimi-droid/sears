<script>
// "What Happened to Sears?" — the catalog comes alive. A different grammar from the earlier episodes: an aged catalog page as the
// ground (darkening to the desk as Sears declines), one moving camera per chapter over a laid-out spread, order blanks that fill

function load(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => { console.warn('missing', src); r(null); }; i.src = src; }); }
const AT = (s, v) => v == null ? s.t0 + .4 : v < 0 ? s.t0 + (-v) * (s.vd || (s.t1 - s.t0)) : s.t0 + v;   // seconds after t0, or (negative) a fraction of the line

// ── textures ──────────────────────────────────────────────────────────────────────────────────────────────
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

    const X = R() * 2048, Y = R() * 1152, r = 4 + R() * 30, gr = g.createRadialGradient(X, Y, 0, X, Y, r);
    gr.addColorStop(0, `rgba(150,100,45,${.05 + R() * .12})`); gr.addColorStop(1, 'rgba(150,100,45,0)'); g.fillStyle = gr; g.fillRect(X - r, Y - r, 2 * r, 2 * r); }
  const v = g.createRadialGradient(1024, 576, 300, 1024, 576, 1250); v.addColorStop(0, 'rgba(90,60,25,0)'); v.addColorStop(1, 'rgba(90,60,25,.32)');

}
function makeDesk() {

  const v = g.createRadialGradient(1024, 520, 200, 1024, 576, 1200); v.addColorStop(0, 'rgba(70,48,26,.22)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  g.fillStyle = v; g.fillRect(0, 0, 2048, 1152); return c;
}
function makeSpeck() { const c = mk(512, 512), g = c.getContext('2d'), R = rnd(23); for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(0,0,0,${R() * .9})`; g.beginPath(); g.arc(R() * 512, R() * 512, R() * 2.2, 0, 7); g.fill(); } return c; }
function makeGrain() { for (let k = 0; k < 6; k++) { const c = mk(256, 256), g = c.getContext('2d'), d = g.createImageData(256, 256), R = rnd(100 + k);

// ── drawing primitives ────────────────────────────────────────────────────────────────────────────────────
const F = { fell: 'Fell', sc: 'FellSC', ost: 'OST', serif: 'Serif', sans: 'Sans', mono: 'Mono', hand: 'Hand' };
function txt(s, X, Y, o = {}) {
  x.save(); x.globalAlpha *= o.a ?? 1; x.font = `${o.it ? 'italic ' : ''}${o.w || 400} ${o.s || 30}px ${o.f || F.serif}`; x.fillStyle = o.c || C.ink;

}
function measure(s, o) { x.save(); x.font = `${o.it ? 'italic ' : ''}${o.w || 400} ${o.s || 30}px ${o.f || F.serif}`; if (o.ls) x.letterSpacing = o.ls + 'px'; const m = x.measureText(s).width; x.restore(); return m; }
function rr(X, Y, w, h, r) { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }

function cover(img, X, Y, w, h, o = {}) {

  const z = o.z || 1, s = Math.max(w / img.width, h / img.height) * z, sw = w / s, sh = h / s;
  const sx = clamp((img.width - sw) * (o.fx ?? .5), 0, img.width - sw), sy = clamp((img.height - sh) * (o.fy ?? .5), 0, img.height - sh);
  x.save(); x.filter = GR[o.grade || 'sepia']; x.drawImage(img, sx, sy, sw, sh, X, Y, w, h); x.restore();

}
const GR = { sepia: 'grayscale(1) sepia(.5) contrast(1.12) brightness(.96)', colour: 'saturate(.82) contrast(1.04) brightness(.97) sepia(.08)',

// a photo laid on the page: plate (mount + hairline + shadow) or cartouche (rounded, double rule, caption pill)

  const m = o.m ?? 16, dark = o.dark;

  x.strokeStyle = dark ? '#5a4a38' : C.ink; x.lineWidth = 2;

}
function capPill(s, X, Y, side, dark, a = 1) {   // rounded caption box sitting on the frame edge, like the 1921 catalog

  const L = side === 'l' ? X : X - wd; x.save(); x.globalAlpha *= a; x.fillStyle = dark ? '#2a221a' : C.mount; rr(L, Y - ht / 2, wd, ht, 14); x.fill();

// ── grounds and camera ────────────────────────────────────────────────────────────────────────────────────

// ── the map (Natural Earth, schematic) ────────────────────────────────────────────────────────────────────
